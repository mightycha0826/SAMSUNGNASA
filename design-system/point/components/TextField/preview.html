<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>TextField</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></head>
<body>
<div class="pt-row" style="align-items:flex-start;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))"><label class="pt-field"><span class="pt-field__label">메모</span><input class="pt-input" type="text" placeholder="입력"></label><label class="pt-field"><span class="pt-field__label">가게</span><input class="pt-input is-focus" type="text" value="김밥천국"></label><label class="pt-field"><span class="pt-field__label">날짜</span><input class="pt-input" type="text" value="10월 32일" aria-invalid="true" aria-describedby="e1"><span id="e1" class="pt-field__error"><span class="material-symbols-rounded" aria-hidden="true">error</span>없는 날짜예요</span></label></div>
</body>
</html>
