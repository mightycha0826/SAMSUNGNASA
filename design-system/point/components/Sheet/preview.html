<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Sheet</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></head>
<body>
<div style="position:relative;max-width:390px;height:330px;margin:0 auto;overflow:hidden;background:var(--bg)"><div class="pt-col"><button type="button" id="open" class="pt-btn pt-btn--danger">삭제</button></div><div id="box"></div></div>
<script>(function(){var box=document.getElementById("box"),open=document.getElementById("open");function show(){box.innerHTML='<div class="pt-scrim"></div><div class="pt-sheet" role="dialog" aria-modal="true" aria-labelledby="st"><div class="pt-sheet__grip" aria-hidden="true"></div><div id="st" class="pt-sheet__title">이 내역을 삭제할까요?</div><div class="pt-sheet__sub">김밥천국 · −8,500원</div><div class="pt-sheet__actions"><button type="button" class="pt-btn pt-btn--block" data-close>취소</button><button type="button" class="pt-btn pt-btn--danger pt-btn--block" data-close>삭제</button></div></div>';box.querySelectorAll("[data-close],.pt-scrim").forEach(function(b){b.addEventListener("click",hide);});}function hide(){box.querySelectorAll(".pt-sheet,.pt-scrim").forEach(function(e){e.classList.add("is-closing");});setTimeout(function(){box.innerHTML="";},230);}open.addEventListener("click",show);show();})();</script>
</body>
</html>
